<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | netlife.guru</title>

    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="wrapper">
    <header class="logo">
        <svg class="logo-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org" aria-hidden="true">
            <defs>
                <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#a542d7"/>
                    <stop offset="100%" stop-color="#bc71e1"/>
                </linearGradient>
            </defs>
            <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#logoGrad)"/>
            <path d="M18 40 C24 44, 32 44, 46 32" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3.2"
                  stroke-linecap="round"/>
            <circle cx="26" cy="26" r="3" fill="rgba(255,255,255,0.95)"/>
            <text x="50%" y="54%" text-anchor="middle" font-size="21" fill="white">N</text>
        </svg>
        <div class="logo-text">netlife.guru</div>
    </header>

    <main class="card">
        <div class="domain-label">Error 404</div>
        <span class="tag">Oops!</span>
        <h1>Page Not Found</h1>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily
            unavailable.</p>

        <div style="margin-top: 30px;">
            <a href="/examples_error_page/public"
               style="text-decoration: none; color: var(--primary); font-weight: 500; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em;">
                &larr; Back to homepage
            </a>
        </div>
    </main>
</div>

</body>
</html>
